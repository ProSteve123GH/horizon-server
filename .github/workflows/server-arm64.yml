name: server-arm64

# Milestone-one CI: host verification plus the pinned Android ARM64 cross-build.
# Later targets are added only after ARM64 is stable and tablet-validated (TASK.md §0).

on:
  push:
    branches: [server]
  pull_request:
    branches: [server]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  NDK_REVISION: 28.2.13676358
  NDK_ZIP: android-ndk-r28c-linux.zip
  ANDROID_TARGET: aarch64-linux-android

jobs:
  arm64-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain and Android target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal \
                --no-modify-path --target "$ANDROID_TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Cache compiled crates and the NDK so rebuilds only recompile this repository's code.
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-cli-${{ env.RUST_TOOLCHAIN }}

      - name: Cache pinned Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: ndk-${{ env.NDK_REVISION }}-linux

      - name: Install pinned Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/$NDK_ZIP" \
            "https://dl.google.com/android/repository/$NDK_ZIP"
          unzip -q "$RUNNER_TEMP/$NDK_ZIP" -d "$RUNNER_TEMP/ndk"

      # Use a block scalar here: YAML folds a trailing backslash in a plain
      # scalar into a literal backslash plus a space, which the shell reads as
      # an escaped leading space on the filename argument.
      - name: Verify NDK revision
        run: |
          NDK_DIR="$RUNNER_TEMP/ndk/android-ndk-r28c"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "::error::Missing $NDK_DIR/source.properties; extracted tree:"
            find "$RUNNER_TEMP/ndk" -maxdepth 2 -print
            exit 1
          fi
          grep -q "Pkg.Revision = $NDK_REVISION" "$NDK_DIR/source.properties"

      - name: Host unit tests (locked dependencies)
        run: cargo test --locked

      - name: Host smoke test with engine linked
        run: cargo run --locked --features engine -- --version

      - name: Cross-compile the single ARM64 executable
        run: |
          NDK="$RUNNER_TEMP/ndk/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # These must be exported in this step: GITHUB_ENV/GITHUB_PATH only
          # take effect in later steps, not in the cargo build below.
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$NDK/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android28-clang"
          export PATH="$NDK:$PATH"
          test -x "$CC_aarch64_linux_android" || {
            echo "::error::Missing NDK clang: $CC_aarch64_linux_android"
            exit 1
          }
          # The packaging step needs llvm-readelf from the NDK bin directory.
          echo "$NDK" >> "$GITHUB_PATH"
          cargo build --locked --release --target "$ANDROID_TARGET" --features engine

      - name: Audit that no mod runtime entered the shipped graph
        run: |
          for crate in wasmtime horizon-mod-host horizon-mod-wasm; do
            if cargo tree --target "$ANDROID_TARGET" --features engine -i "$crate" >/dev/null 2>&1; then
              echo "::error::forbidden mod runtime in server build: $crate"
              exit 1
            fi
          done
          echo "verified: shipped ARM64 graph excludes wasmtime/mod-host/mod-wasm"

      - name: Audit raw binary and package dev tarball
        run: |
          mkdir -p release
          # Release assets use the raw executable plus a checksum, no nested archives.
          install -m 0755 "target/$ANDROID_TARGET/release/horizon-server" \
            "release/horizon-server-aarch64-linux-android"
          ( cd release && sha256sum horizon-server-aarch64-linux-android \
              > horizon-server-aarch64-linux-android.sha256 )
          # Dev artifact keeps the audited tarball (with its internal checksum).
          bash scripts/package_arm64.sh \
            "target/$ANDROID_TARGET/release/horizon-server" "$PWD/release"
          tar -tzf release/horizon-server-aarch64-linux-android.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-server-aarch64-linux-android-raw
          path: |
            release/horizon-server-aarch64-linux-android
            release/horizon-server-aarch64-linux-android.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-server-aarch64-linux-android-dev
          path: release/horizon-server-aarch64-linux-android.tar.gz
          if-no-files-found: error
