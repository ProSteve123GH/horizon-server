[package]
name = "horizon-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Standalone, single-executable vanilla-compatible Minecraft 26.3 dedicated server"
publish = false

[[bin]]
name = "horizon-server"
path = "src/main.rs"

[features]
default = []
# Opt-in until the CI engine-link check type-verifies the direct entry seam.
engine = [
    "dep:horizon-client",
    "dep:horizon-mod-package",
    "dep:horizon-engine-slots",
    "dep:horizon-mod-api",
    "dep:horizon-mod-points",
    "dep:horizon-guest-stack",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Engine seam: direct client entry, never horizon-game (which pulls the mod host).
horizon-client = { path = "vendor/horizon/crates/horizon-client", default-features = false, optional = true }
horizon-mod-package = { path = "vendor/horizon/crates/horizon-mod-package", default-features = false, optional = true }
# Pre-entry platform providers that upstream's mod host installs for us. None of these pull wasmtime.
horizon-engine-slots = { path = "vendor/horizon/crates/horizon-engine-slots", optional = true }
horizon-mod-api = { path = "vendor/horizon/crates/horizon-mod-api", optional = true }
horizon-mod-points = { path = "vendor/horizon/crates/horizon-mod-points", optional = true }
horizon-guest-stack = { path = "vendor/horizon/crates/horizon-guest-stack", optional = true }

# Same patched third-party crates as pinned upstream 26.3.
[patch.crates-io]
wgpu-hal = { path = "vendor/horizon/third_party/wgpu-hal" }
naga = { path = "vendor/horizon/third_party/naga" }
libmimalloc-sys = { path = "vendor/horizon/third_party/libmimalloc-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
